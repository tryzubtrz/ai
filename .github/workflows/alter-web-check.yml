name: ALTER Web Check

on:
  push:
    branches: [alter-foundation]
    paths:
      - "ALTER/web/**"
      - ".github/workflows/alter-web-check.yml"
  pull_request:
    paths:
      - "ALTER/web/**"
      - ".github/workflows/alter-web-check.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALTER/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build
