name: ALTER Core Check

on:
  push:
    branches: [alter-foundation]
    paths:
      - "ALTER/core/**"
      - ".github/workflows/alter-core-check.yml"
  pull_request:
    paths:
      - "ALTER/core/**"
      - ".github/workflows/alter-core-check.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALTER/core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
